name: Release AAB

# يبني حزمة AAB موقَّعة بمفتاح الرفع لتُرفع إلى Google Play Console.
# شغّله يدويًا: Actions ← Release AAB ← Run workflow.
# يحتاج أربعة أسرار في المستودع (Settings ← Secrets and variables ← Actions):
#   UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD
# (أنشئها بتشغيل workflow ‏«Create upload key» مرة واحدة).

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check secrets
        env:
          B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          for v in B64 PW AL KP; do
            if [ -z "${!v}" ]; then echo "السر المطلوب مفقود ($v). شغّل Create upload key أولًا وأضف الأسرار."; exit 1; fi
          done

      - name: Decode keystore
        env:
          B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build release bundle
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle :app:bundleRelease --stacktrace

      - name: Verify signature
        run: |
          jarsigner -verify -verbose:summary app/build/outputs/bundle/release/app-release.aab | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: arabic-ui-editor-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
