name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # يثبّت Gradle مباشرة، فلا حاجة لملفات gradlew أو gradle-wrapper.jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # الـ APK يُبنى ويُرفع أولًا، فيبقى قابلًا للتنزيل حتى لو فشل أي اختبار لاحقًا.
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-ui-editor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # اختبارات المنطق (الهندسة، الخصائص، التراجع، JSON، الحفظ). فشلها يجعل التشغيل أحمر.
      - name: Run logic tests
        run: gradle :app:testDebugUnitTest --tests "*CanvasMathTest" --tests "*ProjectStorageTest" --tests "*EditHistoryTest" --tests "*PropertyRegistryTest" --tests "*ElementOpsTest" --tests "*ComponentLibraryTest" --tests "*PropertyPersistenceTest" --tests "*LayoutEngineTest" --tests "*ElementTreeTest" --tests "*ScreenOpsTest" --tests "*ScreensPersistenceTest" --tests "*PreviewSizesTest" --tests "*DesignSystemTest" --tests "*SmartAlignTest" --stacktrace

      # اختبارات واجهة حقيقية عبر Robolectric: إيماءات مساحة التصميم، ولوحة الخصائص،
      # تُشغَّل حتى لو فشلت اختبارات المنطق.
      - name: Run UI tests (Robolectric)
        if: always()
        run: gradle :app:testDebugUnitTest --tests "*DesignCanvasGestureTest" --tests "*PropertiesPanelTest" --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
